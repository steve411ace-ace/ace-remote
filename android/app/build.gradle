plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "vn.aceremote.app"
    compileSdk = 37
    ndkVersion = "29.0.14206865"
    buildToolsVersion = "37.0.0"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "vn.aceremote.app"
        minSdk = 29
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            // (Khôi phục 13/11/2026 — Codex đã xóa mất khối này; fixed signing key
            //  vẫn còn nợ trước khi gọi đây là bản ổn định.)
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// A file AAR carries no Maven POM. Mirror FreeRDP 3.33.0 runtime dependencies.
// Room's annotation processor runs upstream when compiling the AAR, not here.
dependencies {
    implementation files('libs/freeRDPCore-qa.aar')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'net.zetetic:sqlcipher-android:4.17.0@aar'
    implementation 'androidx.sqlite:sqlite:2.7.0'
}
