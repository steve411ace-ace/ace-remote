plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Khóa ký CỐ ĐỊNH cho mọi bản build (bước 30, theo cách Thuốc Vui đã làm từ
// v1.2.0): trước đây mỗi máy build cloud tự tạo 1 debug.keystore ngẫu nhiên
// nên chữ ký khác nhau, Android không cho cài đè. Nay khóa được lưu dưới dạng
// base64 (file debug.keystore.base64, dạng text nên đẩy qua GitHub được, còn
// file keystore nhị phân thì không) và giải mã lại thành debug.keystore ngay
// lúc build, nên mọi bản sau này đều cùng 1 chữ ký, cài đè được luôn.
// Đây là khóa DEBUG (mật khẩu chuẩn của Android debug key), không phải khóa
// phát hành Play Store. App chỉ phát qua Firebase App Distribution cho tester,
// không phát hành Play Store — giống hệt Thuốc Vui.
// Không cần GitHub Secrets nào cho việc ký. Bản sao lưu keystore gốc nằm trên
// PC của An (xem docs/rdp-step30-fixed-key-thuoc-vui.md).
def fixedDebugKeystore = file("debug.keystore")
def fixedDebugKeystoreBase64 = file("debug.keystore.base64")
if (!fixedDebugKeystore.exists() && fixedDebugKeystoreBase64.exists()) {
    fixedDebugKeystore.bytes = java.util.Base64.getDecoder().decode(fixedDebugKeystoreBase64.text.trim())
}

android {
    namespace = "vn.aceremote.app"
    compileSdk = 37
    ndkVersion = "29.0.14206865"
    buildToolsVersion = "37.0.0"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "vn.aceremote.app"
        minSdk = 29
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        debug {
            storeFile = fixedDebugKeystore
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        release {
            // Signing with the fixed debug key, so `flutter run --release`
            // works and every CI build has the same signature.
            // First fixed-key build still needs one uninstall/reinstall
            // (different signature from the per-runner debug builds);
            // later builds update in place and keep app data.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// A file AAR carries no Maven POM. Mirror FreeRDP 3.33.0 runtime dependencies.
// Room's annotation processor runs upstream when compiling the AAR, not here.
dependencies {
    implementation files('libs/freeRDPCore-qa.aar')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'net.zetetic:sqlcipher-android:4.17.0@aar'
    implementation 'androidx.sqlite:sqlite:2.7.0'
}
