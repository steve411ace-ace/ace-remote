name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Step 28: fetch-depth 2 — the version check compares pubspec.yaml
          # against the previous commit, and the release-notes fallback
          # uses the current commit message.
          fetch-depth: 2
      # Step 28: every build must ship a NEW version (Thuoc Vui bumps
      # pubspec.yaml by hand on every release). The build FAILS when the
      # version is unchanged from the previous commit.
      - name: Check version was bumped
        shell: bash
        run: python3 scripts/check_version.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - run: flutter pub get
      - name: Restore Gradle wrapper and launcher icons
        run: |
          flutter create --template=app --org vn.aceremote --project-name ace_remote /tmp/tpl
          cp /tmp/tpl/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          cp /tmp/tpl/android/gradlew android/gradlew
          cp /tmp/tpl/android/gradlew.bat android/gradlew.bat
          cp -r /tmp/tpl/android/app/src/main/res/mipmap-* android/app/src/main/res/
          chmod +x android/gradlew
      # Signing (bước 30, theo cách Thuốc Vui): khóa debug cố định được commit
      # trong repo dạng base64 (android/app/debug.keystore.base64); build.gradle
      # tự giải mã thành debug.keystore lúc build nên mọi bản cùng 1 chữ ký,
      # cài đè được. Không cần GitHub Secrets nào cho việc ký.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
      # Step 28: read the version from pubspec.yaml for the release tag,
      # and build the release notes from the newest CHANGELOG.md entry
      # (fallback: the push commit message).
      - name: Read version from pubspec
        id: version
        shell: bash
        run: |
          set -euo pipefail
          full=$(grep -E '^version:' pubspec.yaml | sed 's/^version: *//')
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "name=${full%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${full##*+}" >> "$GITHUB_OUTPUT"
      - name: Generate release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py CHANGELOG.md release-notes.txt
          echo '--- release notes ---'
          cat release-notes.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: "Ace Remote v${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})"
          body_path: release-notes.txt
          files: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload to Firebase App Distribution
        uses: wzieba/firebase-distribution-github-action@v1
        with:
          appId: 1:443475386602:android:51276f708ef1ddcf293793
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: build/app/outputs/flutter-apk/app-release.apk
          testers: steve411ace@gmail.com
          # Step 28: detailed notes from CHANGELOG.md (see above).
          releaseNotesFile: release-notes.txt
